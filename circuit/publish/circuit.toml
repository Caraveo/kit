schema = 1

[circuit]
id = "kit.publish"
name = "Publish"
publisher = "kit"
description = "Publish a Linux game to Kit Store for review and approval."
tags = ["Pro"]
version = "0.1.1"
channel = "alpha"
license = "MIT"
kit = ">=0.0.6"
platforms = ["linux", "macos", "windows"]
architectures = ["any"]
permissions = ["network.client", "project.read", "project.write", "editor.ui"]
documentation = "https://publish.kitgameengine.win/docs"
repository = "https://github.com/caraveo/kit"
dashboard = "https://login.kitgameengine.win/account/circuits"

[config.store_url]
type = "url"
label = "Kit Store API"
default = "https://publish.kitgameengine.win"
description = "Official Kit Store backend."
