[workspace]
resolver = "3"
members = ["modules/*", "kit", "player", "editor", "web/player"]

[workspace.package]
version = "0.0.3"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
kit_ecs = { path = "modules/kit_ecs" }
kit_core = { path = "modules/kit_core" }
kit_scene = { path = "modules/kit_scene" }
kit_input = { path = "modules/kit_input" }
kit_resource = { path = "modules/kit_resource" }
kit_graphics = { path = "modules/kit_graphics" }
kit_gamesys = { path = "modules/kit_gamesys" }
kit_render = { path = "modules/kit_render" }
kit_x = { path = "modules/kit_x" }
kit_script = { path = "modules/kit_script" }
kit_engine = { path = "modules/kit_engine" }
kit_collider = { path = "modules/kit_collider" }
kit_physics = { path = "modules/kit_physics" }
kit_path = { path = "modules/kit_path" }
kit_audio = { path = "modules/kit_audio" }
kit_post = { path = "modules/kit_post" }
kit_gamedata = { path = "modules/kit_gamedata" }
kit_diagram = { path = "modules/kit_diagram" }
kit_rex = { path = "modules/kit_rex" }
kit_export_security = { path = "modules/kit_export_security", default-features = false }
kit = { path = "kit" }

ash = "0.38"
ash-window = "0.13"
winit = "0.30.13"
raw-window-handle = "0.6"
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }
naga = { version = "30", features = ["wgsl-in", "spv-out"] }
glam = { version = "0.34", features = ["serde", "bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
egui = "0.36"
egui-winit = "0.36"
egui-ash-renderer = { version = "0.13", features = ["gpu-allocator"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
rfd = "0.15"
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "names"] }
tobj = { version = "4", default-features = false }
base64 = "0.22"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2
