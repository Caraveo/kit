[package]
name = "kit_multiplayer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The Multiplayer Circuit in Kit's game runtime: connects games that have the Circuit installed and enabled, and syncs their Realtime Sync objects. Does nothing otherwise."
license = "MIT"

[dependencies]
kit_realtime = { path = "../sdk" }
kit_core.workspace = true
kit_ecs.workspace = true
kit_scene.workspace = true
kit_gamesys.workspace = true
kit_resource.workspace = true
glam.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
ureq = { version = "=3.5.1", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
