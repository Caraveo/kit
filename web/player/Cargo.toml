[package]
name = "kit_web"
description = "Kit's web player: runs a game in the browser (WebAssembly) and hands frames to a WebGPU renderer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kit_ecs.workspace = true
kit_core.workspace = true
kit_scene.workspace = true
kit_input.workspace = true
kit_resource.workspace = true
kit_gamesys.workspace = true
kit_gamedata.workspace = true
kit_diagram.workspace = true
kit_rigg.workspace = true
kit_render = { workspace = true, default-features = false }
kit_post.workspace = true
kit_x.workspace = true
kit_script.workspace = true
kit_xui.workspace = true
kit_collider.workspace = true
kit_physics.workspace = true
kit_path.workspace = true
kit_audio = { workspace = true, default-features = false }
kit_cinematics = { path = "../../circuit/cinematics/runtime" }
kit_particles.workspace = true
glam.workspace = true
anyhow.workspace = true
log.workspace = true
bytemuck.workspace = true

# Signed web exports are verified by the WebAssembly entry points only.
[target.'cfg(target_arch = "wasm32")'.dependencies]
kit_export_security = { workspace = true, features = ["verify"] }
