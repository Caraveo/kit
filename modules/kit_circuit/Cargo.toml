[package]
name = "kit_circuit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Kit Circuits: the manifest format, package verification, project install/lockfile and the Circuit API client used by the editor's Circuit Manager."

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
log.workspace = true
base64.workspace = true
semver = "1"
sha2 = "0.10"
flate2 = "1"
tar = { version = "0.4", default-features = false }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
ureq = { version = "=3.5.1", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "kit-circuit"
path = "src/bin/kit-circuit.rs"
