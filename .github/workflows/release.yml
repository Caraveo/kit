name: Release

# Push a tag like `v0.0.1` to build and publish installers for every platform.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu }
          - { name: linux-aarch64,  os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: windows-x86_64, os: windows-latest,   target: x86_64-pc-windows-msvc }
          - { name: windows-arm64,  os: windows-11-arm,   target: aarch64-pc-windows-msvc }
          - { name: macos-arm64,    os: macos-latest,     target: aarch64-apple-darwin }
          - { name: macos-x86_64,   os: macos-latest,     target: x86_64-apple-darwin }  # cross-built on Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # wasm32: the web player, shipped in every package.
          targets: ${{ matrix.target }},wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libvulkan-dev
      - name: MoltenVK
        if: runner.os == 'macOS'
        # Khronos's official build is universal (x86_64 + arm64); Homebrew's
        # only has the runner's architecture, which breaks the Intel package.
        run: |
          curl -fsSL -o "$RUNNER_TEMP/moltenvk.tar" https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-macos.tar
          tar -xf "$RUNNER_TEMP/moltenvk.tar" -C "$RUNNER_TEMP" MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib
          dylib="$RUNNER_TEMP/MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib"
          lipo "$dylib" -verify_arch x86_64 arm64
          echo "MOLTENVK=$dylib" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --workspace --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p kit-editor -p kit-player
      - name: Build web player
        run: cargo build --release --locked --target wasm32-unknown-unknown -p kit_web

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: packaging/linux/package.sh ${{ matrix.target }}
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: packaging/macos/package.sh ${{ matrix.target }}
      - name: FFmpeg toolchain (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.target == 'aarch64-pc-windows-msvc' && 'CLANGARM64' || 'CLANG64' }}
          install: >-
            make curl tar xz
            ${{ matrix.target == 'aarch64-pc-windows-msvc' && 'mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-llvm' || 'mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-llvm' }}

      - name: Build FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: packaging/ffmpeg/build.sh ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: packaging/windows/package.ps1 -Target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: kit-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v version="$GITHUB_REF_NAME" '
            /^## / { if (found) exit; found = ($2 == version || $2 == version ":") }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --title "Kit ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
