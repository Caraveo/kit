[package]
name = "kit-player"
description = "Kit player: runs a Kit project."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "kit-player"
path = "src/main.rs"

[dependencies]
kit.workspace = true
kit_resource.workspace = true
kit_export_security = { workspace = true, features = ["decrypt"] }
anyhow.workspace = true
env_logger.workspace = true
log.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
